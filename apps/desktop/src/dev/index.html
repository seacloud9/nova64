<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova64 Dev</title>
    <link rel="stylesheet" href="nova64-app://shared/theme.css" />
    <link rel="stylesheet" href="dev.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">Nova64 Dev</span>
      <span id="project" class="project">No folder open</span>
      <span class="spacer"></span>
      <input
        id="path-input"
        class="path-input"
        type="text"
        spellcheck="false"
        autocapitalize="off"
        placeholder="/path/to/cart folder — press Enter"
      />
      <button id="open-path-btn" type="button">Open</button>
      <button id="open-btn" type="button">Browse…</button>
      <button id="save-btn" type="button" disabled>Save</button>
      <button id="run-btn" class="run-btn" type="button" disabled>▶ Run</button>
      <button id="ai-btn" type="button">🤖 AI</button>
    </header>

    <main class="workbench" id="workbench">
      <aside class="explorer" aria-label="Project files">
        <div class="explorer-head">Explorer</div>
        <ul id="tree" class="tree"></ul>
        <p id="explorer-empty" class="empty">Open a folder to browse its files.</p>
      </aside>

      <section class="editor-pane">
        <div id="tabs" class="tabs" role="tablist"></div>
        <div id="editor-host" class="editor-host"></div>
        <div id="editor-empty" class="editor-empty">
          <div class="logo" aria-hidden="true">⌨️</div>
          <p>Open a folder, then pick a file to edit.</p>
        </div>
      </section>

      <div class="preview-modal" id="preview-pane" hidden>
        <div class="preview-backdrop" id="preview-backdrop"></div>
        <div class="preview-dialog" role="dialog" aria-modal="true" aria-label="Cart preview">
          <div class="preview-head">
            <span>Preview</span>
            <span class="spacer"></span>
            <button id="preview-reload" type="button" title="Restart runtime">↻</button>
            <button id="preview-close" type="button" title="Close preview (Esc)">×</button>
          </div>
          <div id="preview-host" class="preview-host"></div>
          <div class="run-console" id="run-console" aria-label="Cart output"></div>
        </div>
      </div>

      <section class="ai-pane" id="ai-pane" hidden>
        <div class="ai-head">
          <span>AI</span>
          <select id="ai-mode" class="ai-mode" title="Agent mode">
            <option value="ask">Ask</option>
            <option value="plan">Plan</option>
            <option value="edit">Edit</option>
            <option value="agent">Agent</option>
          </select>
          <select id="ai-provider" class="ai-provider" title="Provider"></select>
          <span class="spacer"></span>
          <button id="ai-history-btn" type="button" title="Tool history">📜</button>
          <button id="ai-settings" type="button" title="Provider settings">⚙</button>
          <button id="ai-close" type="button" title="Close">×</button>
        </div>
        <div class="ai-history" id="ai-history" hidden>
          <div class="ai-history-head">Tool history<button id="ai-history-clear" type="button" title="Clear">Clear</button></div>
          <div class="ai-history-list" id="ai-history-list"></div>
        </div>
        <div class="ai-config" id="ai-config" hidden>
          <label>Preset
            <select id="ai-preset"><option value="">Custom…</option></select>
          </label>
          <label>Base URL<input id="ai-baseurl" type="text" spellcheck="false" placeholder="http://localhost:11434" /></label>
          <label>Model<input id="ai-model" type="text" spellcheck="false" placeholder="e.g. llama3.1" /></label>
          <label>API key<input id="ai-key" type="password" spellcheck="false" placeholder="(optional — added when you have one)" /></label>

          <fieldset class="ai-controls">
            <legend>Generation</legend>
            <label class="ai-num" id="ai-temp-row">Temperature
              <input id="ai-temp" type="number" min="0" max="2" step="0.1" />
            </label>
            <label class="ai-num" id="ai-topp-row">Top-p
              <input id="ai-topp" type="number" min="0" max="1" step="0.05" />
            </label>
            <label class="ai-num">Max tokens
              <input id="ai-maxtokens" type="number" min="1" max="200000" step="256" />
            </label>
          </fieldset>

          <fieldset class="ai-prompts">
            <legend>System prompt</legend>
            <div class="ai-prompt-row">
              <select id="ai-prompt-select"><option value="">None (mode default only)</option></select>
              <button id="ai-prompt-new" type="button" title="New prompt">＋</button>
              <button id="ai-prompt-del" type="button" title="Delete prompt">🗑</button>
            </div>
            <input id="ai-prompt-name" type="text" spellcheck="false" placeholder="Prompt name" />
            <textarea id="ai-prompt-text" rows="3" spellcheck="false" placeholder="Custom system prompt — combined with the selected agent mode…"></textarea>
          </fieldset>

          <button id="ai-save-config" type="button">Save</button>
        </div>
        <div class="ai-messages" id="ai-messages"></div>
        <div class="ai-input-row">
          <textarea id="ai-input" class="ai-input" rows="2" placeholder="Ask the AI…  (Enter to send, Shift+Enter for newline)"></textarea>
          <button id="ai-send" class="ai-send" type="button">Send</button>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <span id="status-path"></span>
      <span class="spacer"></span>
      <span id="status-count" class="status-count"></span>
      <span id="status-dirty"></span>
    </footer>

    <script defer src="nova64-app://shared/theme-apply.js"></script>
    <script type="module" src="dev.js"></script>
  </body>
</html>
