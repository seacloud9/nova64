<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova64</title>
    <link rel="stylesheet" href="nova64-app://shared/theme.css" />
    <link rel="stylesheet" href="navigation.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="title-drag">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand">Nova64</span>
      </div>
      <div class="window-controls">
        <button id="win-min" class="win-btn" type="button" aria-label="Minimize" title="Minimize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button id="win-max" class="win-btn" type="button" aria-label="Maximize" title="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg>
        </button>
        <button id="win-close" class="win-btn danger" type="button" aria-label="Close" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor"/></svg>
        </button>
      </div>
    </header>

    <nav class="rail" aria-label="Nova64 surfaces">
      <div class="rail-top">
        <button class="rail-btn is-active" data-view="os" type="button" aria-pressed="true" title="Nova OS">
          <span class="glyph" aria-hidden="true">🖥️</span>
          <span class="label">OS</span>
        </button>
        <button class="rail-btn" data-view="dev" type="button" aria-pressed="false" title="Dev workspace">
          <span class="glyph" aria-hidden="true">⌨️</span>
          <span class="label">Dev</span>
        </button>
      </div>
      <div class="rail-bottom">
        <button class="rail-btn" data-view="settings" type="button" aria-pressed="false" title="Settings">
          <span class="glyph" aria-hidden="true">⚙️</span>
          <span class="label">Set</span>
        </button>
      </div>
    </nav>

    <script defer src="nova64-app://shared/theme-apply.js"></script>
    <script defer src="navigation.js"></script>
  </body>
</html>
