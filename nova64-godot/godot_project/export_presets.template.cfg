; Committed, secret-free export presets for scripts/export-desktop.sh.
; export_presets.cfg itself is gitignored (it can hold signing keys);
; export-desktop.sh copies this file to it when it is missing.
; Preset names must match export-desktop.sh. PCKs are embedded so each
; export is one runnable file. Godot fills any omitted option with defaults.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="bin/export/*"
export_path="bin/export/desktop/Nova64-Windows.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false

[preset.1]

name="Linux/X11"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="bin/export/*"
export_path="bin/export/desktop/Nova64-Linux.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
