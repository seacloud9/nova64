<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova64 Settings</title>
    <link rel="stylesheet" href="nova64-app://shared/theme.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main class="settings">
      <header class="settings-head">
        <h1>Settings</h1>
        <p class="sub">Control center for the Nova64 desktop app.</p>
      </header>

      <section class="card">
        <h2>Appearance</h2>
        <p class="hint">Theme applies live across every surface.</p>
        <div id="theme-grid" class="theme-grid"></div>
      </section>

      <section class="card">
        <h2>About</h2>
        <dl id="about" class="about"></dl>
      </section>
    </main>

    <script defer src="nova64-app://shared/theme-apply.js"></script>
    <script defer src="settings.js"></script>
  </body>
</html>
