name: Release RetroArch cores

# Builds and publishes the Nova64 libretro core for Linux (.so),
# Windows (.dll), and macOS (.dylib universal x86_64 + arm64).
# Triggered automatically when a v*.*.* tag is pushed, or manually via
# the Actions tab so you can cut a one-off pre-release without retagging.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.5.2-cores). Will be created if missing.'
        required: true
        default: 'cores-latest'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

jobs:
  build:
    name: Build core (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            built_name: nova64_libretro.so
            asset_name: nova64_libretro_linux_x86_64.so
            make_args: ''
            apt_deps: 'build-essential zlib1g-dev'
          - target: windows-x86_64
            runner: ubuntu-latest
            built_name: nova64_libretro.dll
            asset_name: nova64_libretro_windows_x86_64.dll
            make_args: 'platform=win-cross'
            apt_deps: 'build-essential gcc-mingw-w64-x86-64 libz-mingw-w64-dev'
          - target: macos-universal
            runner: macos-latest
            built_name: nova64_libretro.dylib
            asset_name: nova64_libretro_macos_universal.dylib
            # Universal binary: clang accepts repeated -arch flags for fat output.
            make_args: 'platform=osx CC=cc\ -arch\ x86_64\ -arch\ arm64'
            apt_deps: ''

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps (Linux/Windows targets)
        if: matrix.apt_deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_deps }}

      - name: Build
        run: make -C retroarch ${{ matrix.make_args }} clean all

      - name: Stage artifact under platform-named filename
        run: |
          mkdir -p staging
          cp "retroarch/${{ matrix.built_name }}" "staging/${{ matrix.asset_name }}"
          # Also keep the canonical (unprefixed) name so the Windows DLL drops
          # straight into RetroArch's cores/ directory without renaming.
          cp "retroarch/${{ matrix.built_name }}" "staging/${{ matrix.built_name }}"
          ls -lh staging

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target }}
          path: staging/
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + checksum + manifest
        run: |
          mkdir -p dist-cores
          find artifacts -type f \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) \
            -exec cp -v {} dist-cores/ \;
          cd dist-cores
          # SHA256SUMS over every shipped binary
          sha256sum * > SHA256SUMS.txt
          cat > README.md <<'EOF'
          # Nova64 libretro cores

          Drop the file matching your platform into your RetroArch `cores/`
          directory:

          | Platform | File |
          |----------|------|
          | Windows (x86_64) | `nova64_libretro.dll` (= `nova64_libretro_windows_x86_64.dll`) |
          | Linux (x86_64)   | `nova64_libretro.so`  (= `nova64_libretro_linux_x86_64.so`) |
          | macOS (universal x86_64 + arm64) | `nova64_libretro.dylib` (= `nova64_libretro_macos_universal.dylib`) |

          `SHA256SUMS.txt` lets you verify the download.

          On macOS, the binary is unsigned — you may need to clear quarantine:
          `xattr -dr com.apple.quarantine nova64_libretro.dylib`

          Source: https://github.com/seacloud9/nova64
          EOF
          ls -lh
          echo '----- SHA256SUMS.txt -----'
          cat SHA256SUMS.txt

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }} — RetroArch cores
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-cores/*
