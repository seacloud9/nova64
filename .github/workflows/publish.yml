name: Publish to npm (manual fallback)

# NOTE: The AUTOMATIC npm publish now lives in release-cores.yml as the
# `npm-publish` job, which is gated on ALL platform cores + tests building green
# (needs: build). That is the safe path — npm ships only when everything is green.
#
# This workflow is a MANUAL, DELIBERATE fallback (workflow_dispatch only). It is
# NOT gated on the core builds, so use it only for an emergency/hotfix npm
# publish when you knowingly want to ship the package without the full release.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish Package (manual, ungated)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub release
      id-token: write   # needed for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order intentional: must match package.json prepublishOnly
      # (lint && test:all && build). Tests run before build so a failing
      # suite cannot ship a stale dist/.
      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**
