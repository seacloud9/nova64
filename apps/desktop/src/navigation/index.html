<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova64</title>
    <link rel="stylesheet" href="nova64-app://shared/theme.css" />
    <link rel="stylesheet" href="navigation.css" />
  </head>
  <body>
    <header class="titlebar">
      <nav class="menubar" id="menubar" aria-label="Application menu">
        <span class="brand"><span class="brand-dot" aria-hidden="true"></span>Nova64</span>

        <div class="menu" data-menu="file">
          <button class="menu-top" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-file">File</button>
          <ul class="menu-dropdown" id="menu-file" role="menu" hidden>
            <li class="menu-row" role="menuitem" tabindex="-1" data-cmd="dev:open">
              <span class="menu-label">Open Folder…</span><span class="menu-accel">Ctrl+O</span>
            </li>
            <li class="menu-row" role="menuitem" tabindex="-1" data-cmd="dev:run">
              <span class="menu-label">Run Cart</span><span class="menu-accel">F5</span>
            </li>
            <li class="menu-row" role="menuitem" tabindex="-1" data-cmd="dev:save">
              <span class="menu-label">Save</span><span class="menu-accel">Ctrl+S</span>
            </li>
            <li class="menu-sep" role="separator"></li>
            <li class="menu-row" role="menuitem" tabindex="-1" data-cmd="view:settings">
              <span class="menu-label">Settings</span><span class="menu-accel">Ctrl+,</span>
            </li>
            <li class="menu-sep" role="separator"></li>
            <li class="menu-row" role="menuitem" tabindex="-1" data-cmd="window:close">
              <span class="menu-label">Quit</span><span class="menu-accel">Ctrl+Q</span>
            </li>
          </ul>
        </div>

        <div class="menu" data-menu="window">
          <button class="menu-top" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-window">Window</button>
          <ul class="menu-dropdown" id="menu-window" role="menu" hidden>
            <li class="menu-row" role="menuitemradio" tabindex="-1" data-cmd="view:os" data-view="os" aria-checked="true">
              <span class="menu-check" aria-hidden="true">●</span><span class="menu-label">Nova OS</span>
            </li>
            <li class="menu-row" role="menuitemradio" tabindex="-1" data-cmd="view:dev" data-view="dev" aria-checked="false">
              <span class="menu-check" aria-hidden="true">●</span><span class="menu-label">Dev Workspace</span>
            </li>
            <li class="menu-row" role="menuitemradio" tabindex="-1" data-cmd="view:settings" data-view="settings" aria-checked="false">
              <span class="menu-check" aria-hidden="true">●</span><span class="menu-label">Settings</span>
            </li>
            <li class="menu-sep" role="separator"></li>
            <li class="menu-row" role="menuitem" tabindex="-1" data-cmd="toggle-rail">
              <span class="menu-label">Toggle Sidebar</span><span class="menu-accel">Ctrl+B</span>
            </li>
          </ul>
        </div>
      </nav>

      <div class="titlebar-drag"></div>

      <div class="window-controls">
        <button id="win-min" class="win-btn" type="button" aria-label="Minimize" title="Minimize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button id="win-max" class="win-btn" type="button" aria-label="Maximize" title="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg>
        </button>
        <button id="win-close" class="win-btn danger" type="button" aria-label="Close" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor"/></svg>
        </button>
      </div>
    </header>

    <div id="menu-scrim" class="menu-scrim" hidden></div>

    <nav class="rail" id="rail" aria-label="Nova64 windows (toggle with Cmd/Ctrl+B)">
      <button class="rail-btn is-active" data-view="os" type="button" aria-pressed="true" title="Nova OS">
        <span class="glyph" aria-hidden="true">🖥️</span>
        <span class="label">OS</span>
      </button>
      <button class="rail-btn" data-view="dev" type="button" aria-pressed="false" title="Dev workspace">
        <span class="glyph" aria-hidden="true">⌨️</span>
        <span class="label">Dev</span>
      </button>
      <button class="rail-btn" data-view="settings" type="button" aria-pressed="false" title="Settings">
        <span class="glyph" aria-hidden="true">⚙️</span>
        <span class="label">Set</span>
      </button>
    </nav>

    <script defer src="nova64-app://shared/theme-apply.js"></script>
    <script defer src="navigation.js"></script>
  </body>
</html>
