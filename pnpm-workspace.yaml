# Nova64 pnpm workspace.
#
# Scopes the new shared/host trees for the desktop + VS Code platform program
# (see plans/NOVA64_DESKTOP_VSCODE_PLAN.md §4). Deliberately does NOT include
# `os9-shell` — it keeps its own independent install/build (`cd os9-shell && pnpm
# install && pnpm build`) so this change stays surgical. The root `nova64` package
# remains publishable; these workspace packages are internal (not npm-published).
packages:
  - 'packages/*'
  - 'apps/*'
  - 'extensions/*'

# Dependencies allowed to run install scripts. pnpm blocks these by default.
# The field is `allowBuilds` as of pnpm 11; it replaced `onlyBuiltDependencies`,
# which pnpm 11 no longer honours here. Leaving the old key meant a fresh
# `pnpm install` failed with ERR_PNPM_IGNORED_BUILDS and took `pnpm test` down
# with it, because the deps-status check runs install first.
#   electron         — postinstall downloads the platform binary; the desktop
#                      app cannot launch without it.
#   esbuild          — postinstall installs the platform binary Vite builds on.
#   msgpackr-extract — optional native accelerator for the Colyseus client.
allowBuilds:
  electron: true
  esbuild: true
  msgpackr-extract: true
